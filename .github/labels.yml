# GitHub Issues/PRラベルの定義ファイル。
#
# 注意: このファイルを置くだけではGitHubへラベルは自動登録されません（GitHubは
# .github/labels.yml を自動で読み込む機能を持っていません）。実際にリポジトリへ
# 登録するには、GitHub CLI（`gh label create`）またはラベル同期用のGitHub Action
# （例: 外部の `*-labeler` 系Action）を別途セットアップして、このファイルを読み込む
# 必要があります。登録手順は docs/development/GITHUB_ISSUES_WORKFLOW.md を参照してください。

# ---------- 種別（type） ----------
- name: "type: feature"
  color: "0E8A16"
  description: "新機能の追加・既存機能の拡張"
- name: "type: bug"
  color: "D73A4A"
  description: "既存機能が仕様どおりに動作しない不具合"
- name: "type: refactor"
  color: "1D76DB"
  description: "外部仕様を変えない内部実装の改善"
- name: "type: documentation"
  color: "0075CA"
  description: "ドキュメントの追加・修正"
- name: "type: investigation"
  color: "5319E7"
  description: "設計調査・技術検証・PoC・原因調査"
- name: "type: test"
  color: "BFD4F2"
  description: "テストの追加・修正"
- name: "type: maintenance"
  color: "C5DEF5"
  description: "依存更新・雑務など上記に当てはまらない保守作業"

# ---------- 対象領域（area） ----------
- name: "area: frontend"
  color: "FBCA04"
  description: "frontend/（React UI）に関する変更"
- name: "area: backend"
  color: "FEF2C0"
  description: "src/app/（FastAPI）に関する変更"
- name: "area: api"
  color: "F9D0C4"
  description: "APIエンドポイント（src/app/main.py）に関する変更"
- name: "area: dataset"
  color: "C2E0C6"
  description: "Dataset Manager・学習データセットに関する変更"
- name: "area: preprocessing"
  color: "BFE5BF"
  description: "前処理パイプライン（services/preprocess.py等）に関する変更"
- name: "area: training"
  color: "D4C5F9"
  description: "学習（Tesseract/PaddleOCR/分類モデル）に関する変更"
- name: "area: evaluation"
  color: "E4C1F9"
  description: "モデル評価（CER等の指標）に関する変更"
- name: "area: experiment"
  color: "F9C1DD"
  description: "実験管理（Experiment Tracking）に関する変更"
- name: "area: model"
  color: "C1E1F9"
  description: "モデル管理・リリース管理に関する変更"
- name: "area: benchmark"
  color: "C1F9E8"
  description: "Benchmark Runner・Benchmark Centerに関する変更"
- name: "area: documentation"
  color: "BFDADC"
  description: "docs/・readme.mdに関する変更"
- name: "area: infrastructure"
  color: "D0D4D8"
  description: ".github/・CI/CD・開発基盤に関する変更"

# ---------- OCRエンジン（engine） ----------
- name: "engine: tesseract"
  color: "5A6B8C"
  description: "Tesseractエンジンに関する変更"
- name: "engine: paddleocr"
  color: "5A8C6B"
  description: "PaddleOCRエンジンに関する変更"
- name: "engine: easyocr"
  color: "8C5A6B"
  description: "EasyOCRエンジンに関する変更（現時点では推論のみ対応）"
- name: "engine: trocr"
  color: "8C6B5A"
  description: "TrOCR対応（今後の開発対象。ラベルのみ準備済み・現時点では未実装）"

# ---------- 優先度（priority） ----------
- name: "priority: critical"
  color: "B60205"
  description: "即対応が必要（本番影響・データ破損リスク等）"
- name: "priority: high"
  color: "D93F0B"
  description: "優先度が高い"
- name: "priority: medium"
  color: "FBCA04"
  description: "通常の優先度"
- name: "priority: low"
  color: "0E8A16"
  description: "優先度が低い・急がない"

# ---------- 状態補助（status） ----------
- name: "status: blocked"
  color: "000000"
  description: "他の作業・意思決定待ちで着手できない"
- name: "status: needs-info"
  color: "D876E3"
  description: "報告者・担当者からの追加情報待ち"
- name: "status: ready"
  color: "0E8A16"
  description: "仕様レビュー済みで着手可能"
- name: "status: review"
  color: "FBCA04"
  description: "Pull Requestがレビュー待ち・レビュー中"
